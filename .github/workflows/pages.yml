name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Salam 0.6.2
        run: |
          wget -q https://github.com/SalamLang/Salam/releases/download/v0.6.2/salam-0.6.2-linux-x86_64.tar.gz
          tar xzf salam-0.6.2-linux-x86_64.tar.gz
          echo "$PWD/salam-linux-x86_64" >> "$GITHUB_PATH"
          echo "SALAM_STD=$PWD/salam-linux-x86_64/std" >> "$GITHUB_ENV"

      - name: Ensure a C compiler
        run: |
          if ! command -v clang >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi

      - name: Test the library
        run: make test

      - name: Build the documentation site
        run: make site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
